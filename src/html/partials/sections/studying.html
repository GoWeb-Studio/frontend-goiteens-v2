{% set section = studying %}
<section
  class="{{section.id}} scroll-container pt-20 pb-[104px] md:pb-[132px] container xl:p-0 relative"
>
  {% for item in section.items %}
  <div
    class="studying-box scroll-panel mb-[152px] xl:m-0 xl:flex xl:flex-row-reverse xl:items-center xl:justify-around xl:gap-[74px] xxl:gap-[160px] smOnly:relative"
  >
    <div
      class="studying-frame mx-auto w-full max-w-[480px] md:max-w-[680px] xl:max-w-[589px] xxl:max-w-[640px]"
    >
      <picture>
        <!-- WEBP -->

        <source
          type="image/webp"
          srcset="
            ./assets/images/studying/{{item.img}}.webp    1x,
            ./assets/images/studying/{{item.img}}@2x.webp 2x
          "
        />
        <!-- PNG (insert "image/jpeg" for JPEG) -->
        <img
          class="w-full max-w-[480px] md:max-w-[680px] xl:max-w-[589px] xxl:max-w-[640px]"
          width="330"
          height="207"
          loading="lazy"
          alt="фонове зображення {{item.title}}"
          src="./assets/images/studying/{{item.img}}.png"
          srcset="./assets/images/studying/{{item.img}}@2x.png 2x"
        />
      </picture>
    </div>
    <div class="studying-content mdOnly:overflow-hidden">
      <span
        class="studying-number font-IBMPlexMono text-[84px] font-medium leading-[1.33] text-black-dark md:text-[148px]"
      >
        {{ item.id }}
      </span>
      {% if loop.first %}
      <h2
        class="studying-title mb-4 font-IBMPlexMono text-[18px] font-bold uppercase leading-[1.33] text-white md:mb-3 md:text-[24px] md:leading-[1.7] xl:mb-6 xl:text-[32px] xl:leading-[1.4]"
      >
        {{ item.title }}
      </h2>
      {% else %}
      <h3
        class="studying-subtitle mb-[19px] font-IBMPlexMono text-xl font-semibold uppercase text-black-dark md:mb-6 md:text-[32px] md:leading-[1.3] xl:text-end"
      >
        {{ item.title }}
      </h3>
      {% endif %}

      <p class="studying-text font-normal md:mx-auto md:max-w-[600px] xl:max-w-[849px]">
        {{item.text}}
      </p>
    </div>
  </div>
  {% endfor %}
</section>
