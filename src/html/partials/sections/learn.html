{% set section = learn %}
<section
  class="{{section.id}} py-20 md:pb-[79px] xl:pt-[170px] xl:pb-[287px] xxl:pb-[331px] overflow-hidden"
>
  <div class="container">
    <h2 class="section-title mb-6 md:mb-10 xl:mb-[180px] text-end xxl:mb-10">
      {{section.title}}
    </h2>
    <div class="relative flex flex-col gap-5 xxl:pl-[490px]">
      <div class="hidden xl:relative xl:z-10 xl:block xxl:w-[437px]">
        <picture>
          <!-- WEBP -->
          <source
            media="(min-width: 1600px)"
            type="image/webp"
            srcset="
              ./assets/images/learn/bg-girl-desk.webp    1x,
              ./assets/images/learn/bg-girl-desk@2x.webp 2x
            "
          />
          <source
            media="(min-width: 320px)"
            type="image/webp"
            srcset="./assets/images/learn/bg-girl.webp 1x, ./assets/images/learn/bg-girl@2x.webp 2x"
          />
          <!-- PNG (insert "image/jpeg" for JPEG) -->
          <source
            media="(min-width: 1600px)"
            type="image/png"
            srcset="
              ./assets/images/learn/bg-girl-desk.png    1x,
              ./assets/images/learn/bg-girl-desk@2x.png 2x
            "
          />

          <img
            class="hidden xl:mx-auto xl:block xxl:w-[437px]"
            width="359"
            height="540"
            loading="lazy"
            alt="{{section.imgAlt}}"
            src="./assets/images/learn/bg-girl.png"
            srcset="./assets/images/learn/bg-girl@2x.png 2x"
          />
        </picture>
      </div>
      {% for item in section.items %}
      <div
        class="learn__item border-2 border-black-dark px-[16px] py-6 md:border-4 md:p-[32px] min-h-[155px] xl:min-h-none md:min-h-[175px]"
        data-aos="{{item.data}}"
        data-aos-delay="1000"
      >
        <h3
          class="mb-4 font-IBMPlexMono text-[18px] font-semibold uppercase leading-[1.3] text-black-dark md:mb-4 md:text-[24px] xxl:text-black-light"
        >
          {{item.title}}
        </h3>
        <p class="learn__text text-textColor md:text-[20px] md:leading-[1.4]">{{item.text}}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
