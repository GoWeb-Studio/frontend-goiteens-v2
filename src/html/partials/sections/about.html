{% set section = about %}
<section class="{{section.id}} md:pt-20 xl:pt-[172px]">
  <div class="container">
    <h2 class="mb-6 font-IBMPlexMono text-black-primary text-[20px] font-semibold uppercase leading-[26px] md:text-[32px] md:leading-[42px] md:mb-10 xl:mb-6 xxl:mb-10">
      {{section.title}}
    </h2>
    <p class="mb-6 text-base text-black-secondary font-normal md:mb-8 md:text-xl xl:mb-[96px] xl:max-w-[883px] xxl:mb-20">
      {{section.text}}
    </p>
    <ul
      class="flex md:flex-wrap md:items-center md:justify-between md:gap-y-[48px] xl:gap-y-[90px] smOnly:flex-col smOnly:gap-10"
    >
      {% for item in section.items %} {% if item.img %}
      <li class="about__items md:px-[35px] md:pt-12 xl:px-0 xxl:pb-5">
          <img
            class="item-img mx-auto mb-6 md:mb-4 xxl:mb-6"
            width="{{item.width}}"
            height="{{item.height}}"
            loading="lazy"
            alt="{{item.alt}}"
            src="./assets/images/sections/about/{{item.img}}.webp"
            srcset="./assets/images/sections/about/{{item.img}}@2x.webp 2x"
          />
        <h3
          class="item-title mb-2 text-center text-black-secondary text-[20px] leading-[26px] font-semibold uppercase md:leading-[1.3] xl:mb-4"
        >
          {{item.title}}
        </h3>
        <p class="text-center text-base text-[#6E6E6E] font-normal">
          {{item.text}}
        </p>
      </li>

      {% else %}
      <li class="about__items relative">
        <p
          class="item-number mb-2 text-center font-IBMPlexMono text-[68px] font-semibold uppercase leading-[1.2] md:text-[60px] xl:text-[100px] mdOnly:mb-1"
        >
          {{item.number}}
        </p>
        <p
          class="item-text text-center font-IBMPlexMono text-base font-semibold xl:text-2xl mdOnly:text-[16px]"
        >
          {{item.text}}
        </p>
      </li>
      {% endif %} {% endfor %}
    </ul>
  </div>
</section>
