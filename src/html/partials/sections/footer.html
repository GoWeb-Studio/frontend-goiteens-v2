{% set section = footer %}

<footer class="bg-[#202020] xl:bg-black-dark pb-[52px] pt-8 text-white md:pt-10 md:pb-[56px] xl:pb-10">
  <div class="container xl:flex xl:justify-between">

    <!-- LOGO & SOCIALS BOX -->
    <div class="flex flex-col gap-20 pb-[56px] border-b border-b-[#2E2F30] md:flex-row md:gap-0 md:justify-between md:pb-[64px] xl:p-0 xl:flex-col xl:border-none">

      <!-- LOGO -->
      <div class="mr-auto">
        <a
          class="block w-max duration-300 hover:scale-105 focus:scale-105 smOnly:mx-auto"
          href="{{page.canonical}}"
          aria-label="{{logo.link_logo_aria}}"
        >
          <svg
            class="md:h-[36px] md:w-[142px]"
            width="118"
            height="30"
            aria-label="{{logo.logo_aria}}"
          >
            <use href="./assets/images/sprite.svg#logo-goiteens"></use>
          </svg>
        </a>
      </div>

      <!-- SOCIALS -->
      <ul class="mx-auto flex gap-8 xs:gap-[48px] md:mx-0 md:gap-4">
        {% for social in section.socialItems %}
        <li class="mx-auto">
          <a
            class="fill-white hover:fill-[#FF6C00] focus:fill-[#FF6C00]"
            href="{{social.link}}"
            target="_blank"
            rel="noopener noreferrer nofollow"
            aria-label="{{social.ariaLabel}}"
          >
            <svg
              class="fill-inherit duration-300 hover:scale-125"
              width="40"
              height="40"
              aria-label="{{social.svgAlt}}"
            >
              <title>{{social.alt}}</title>
              <use href="./assets/images/sprite.svg#{{social.svg}}"></use>
            </svg>
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>

    <!-- PAYMENTS, TEL & LINKS BOX -->
    <div class="pt-6 text-center md:pt-8 md:flex md:justify-between md:items-center xl:flex-col xl:justify-start xl:items-end xl:gap-5 xl:p-0">

      <!-- PHONE NUMBER -->
      <a
        href="{{contact.phoneLink}}"
        target="_blank"
        rel="noopener noreferrer nofollow"
        class="footer-phone block mb-7 pl-8 w-[211px] mx-auto text-white font-IBMPlexSans text-xl font-normal leading-[24px] md:m-0 xl:mb-[10px]">
        <span>{{contact.phone}}</span>
      </a>

      <!-- PAYMENTS -->
      <ul class="mb-7 flex justify-center gap-4 md:mb-0">
        {% for payment in section.paymentList %}
        <li>
          <svg width="38" height="26" aria-label="{{payment.svgAlt}}">
            <title>{{payment.svgAlt}}</title>
            <use href="./assets/images/sprite.svg#{{payment.svg}}"></use>
          </svg>
        </li>
        {% endfor %}
      </ul>

      <!-- LINKS -->
      <div class="md:flex md:flex-col md:gap-1 md:text-end smOnly:text-center xl:gap-[10px]">
        {% for agreement in section.documentList %}
        <a
          class="block text-[16px] text-[#ABABAB] underline duration-300 hover:text-[#FF6C00] focus:text-[#FF6C00]"
          href="{{agreement.link}}"
          target="_blank"
          rel="noopener noreferrer nofollow"
        >
          {{agreement.title}}
        </a>
        {% endfor %}
      </div>
    </div>
  </div>
</footer>
