<form class="text-lg" id="{{formId}}" novalidate autocomplete="on">
  <div class="inputs-container flex flex-wrap gap-6 md:gap-[32px]">{% block formFields %} {% endblock %}</div>
  <div class="formBtn-wrapper">
    <button
      class="w-full text-center text-[16px] font-IBMPlexSans font-normal outline-none duration-300 ease-linear disabled:border-none disabled:bg-gray-200 disabled:hover:text-white btnSubmit"
      type="submit"
    >
        {% if section.id === "hero" %} {{hero.btn}} {% else %} {{ form.btnSubmit }} {% endif %}
      </button>
  </div>
</form>
