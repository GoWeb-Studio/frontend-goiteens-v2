<form class="text-lg" id="{{formId}}" novalidate autocomplete="on">
  <div class="flex flex-wrap gap-6 md:gap-[32px]">{% block formFields %} {% endblock %}</div>
  <div class="formBtn-wrapper">
    <button
      class="form-btn hero-form-btn disabled:border-none disabled:bg-gray-200 disabled:hover:text-white"
      type="submit"
    >
      {% if section.id === "hero" %} {{hero.btn}} {% else %} {{ form.btnSubmit }} {% endif %}
    </button>
  </div>
</form>
